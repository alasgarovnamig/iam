# Used by `golangci-lint run` locally; CI runs go vet + gosec + govulncheck.
run:
  timeout: 5m
  build-tags:
    - integration

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - bodyclose      # every HTTP response body must be closed
    - noctx          # outbound requests must carry a context
    - rowserrcheck   # pgx rows.Err() must be checked
    - sqlclosecheck

issues:
  exclude-rules:
    # Test fakes intentionally ignore some errors for brevity.
    - path: _test\.go
      linters: [errcheck]

linters-settings:
  errcheck:
    check-type-assertions: true
