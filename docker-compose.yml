name: wallet-gateway

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-wallet_gateway}
  POSTGRES_USER: ${POSTGRES_USER:-wallet}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_dev_password}
  POSTGRES_APP_USER: ${POSTGRES_APP_USER:-wallet_app}
  POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-wallet_app_dev_password}

# Shared service configuration. DATABASE_URL is the migration/owner role;
# DATABASE_APP_URL is the RLS-enforced application role.
x-service-env: &service-env
  DATABASE_URL: postgres://${POSTGRES_USER:-wallet}:${POSTGRES_PASSWORD:-wallet_dev_password}@postgres:5432/${POSTGRES_DB:-wallet_gateway}?sslmode=disable
  DATABASE_APP_URL: postgres://${POSTGRES_APP_USER:-wallet_app}:${POSTGRES_APP_PASSWORD:-wallet_app_dev_password}@postgres:5432/${POSTGRES_DB:-wallet_gateway}?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-wallet-gateway}
  KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-wallet-gateway.dlq}
  OPA_URL: http://opa:8181
  OPENFGA_URL: http://openfga:8080
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-in-production-0123456789abcdef}
  JWT_ISSUER: ${JWT_ISSUER:-wallet-gateway}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-wallet-gateway-api}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  # ── Data stores ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployments/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet} -d ${POSTGRES_DB:-wallet_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Kafka (KRaft, no ZooKeeper) ───────────────────────────────────────────
  # Apache's official image, single-node KRaft (no ZooKeeper).
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: wallet-gateway-cluster-1
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: wallet-gateway
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # ── Authorization ─────────────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:1.4.2
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--set=decision_logs.console=false"
      - "/policies"
    volumes:
      - ./deployments/opa/policies:/policies:ro
    ports:
      - "${OPA_PORT:-8181}:8181"

    healthcheck:
      # Use the OPA binary to check HTTP health in the distroless image.
      test:
        - CMD
        - /opa
        - eval
        - --fail
        - 'http.send({"method":"GET","url":"http://127.0.0.1:8181/health","timeout":"3s"}).status_code == 200'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ── OPA Studio ──────────────────────────────────────────────────
  opa-studio:
    image: opa-studio:1.4.2
    container_name: opa-studio
    environment:
      OPA_STUDIO_ADDR: ":9080"
      OPA_STUDIO_LOCAL_OPA: "false"
      OPA_STUDIO_CONNECTIONS: >-
        [{"id":"wallet-gateway","name":"Wallet Gateway OPA","url":"http://opa:8181"}]
      OPA_STUDIO_AUTH_MODE: basic
      OPA_STUDIO_BASIC_USER: ${OPA_STUDIO_USER:-admin}
      OPA_STUDIO_BASIC_PASSWORD: ${OPA_STUDIO_PASSWORD:?Set OPA_STUDIO_PASSWORD in .env}
    ports:
      - "127.0.0.1:${OPA_STUDIO_PORT:-3020}:9080"
    volumes:
      - opa-studio-data:/var/lib/opa-studio
    depends_on:
      opa:
        condition: service_healthy
    restart: unless-stopped

#  # OPA Viewer — a small, self-contained UI to browse the policies and data
#  # loaded into OPA and to test decisions live with a custom input. It is
#  # nginx serving a static page that reverse-proxies to the opa service, so
#  # the browser talks to OPA without CORS. Dev tool, not on the runtime path.
#  # Open http://localhost:${OPA_VIEWER_PORT:-3020}
#  opa-viewer:
#    image: nginx:1.27-alpine
#    container_name: opa-viewer
#    volumes:
#      - ./deployments/opa-viewer/index.html:/usr/share/nginx/html/index.html:ro
#      - ./deployments/opa-viewer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
#    ports:
#      - "${OPA_VIEWER_PORT:-3020}:80"
#    depends_on:
#      - opa
#    restart: unless-stopped

  openfga-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openfga
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: ${OPENFGA_DB_PASSWORD:-openfga_dev_password}
    volumes:
      - openfga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 20

  openfga-migrate:
    image: openfga/openfga:v1.8.4
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD:-openfga_dev_password}@openfga-db:5432/openfga?sslmode=disable
    depends_on:
      openfga-db:
        condition: service_healthy
    restart: on-failure

  openfga:
    image: openfga/openfga:v1.8.4
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD:-openfga_dev_password}@openfga-db:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "${OPENFGA_PORT:-8080}:8080"      # HTTP API
      - "${OPENFGA_PLAYGROUND_PORT:-3010}:3000"  # Playground
    depends_on:
      openfga-db:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── OpenFGA Studio UI ─────────────────────────────────────────────
  openfga-studio:
    image: ghcr.io/prakashm88/openfga-studio:latest
    container_name: openfga-studio
    environment:
      OPENFGA_ENDPOINT: http://openfga:8080
      DISABLE_LOCAL_OPENFGA: "true"
    ports:
      - "${OPENFGA_STUDIO_PORT:-3030}:3000"
    depends_on:
      openfga:
        condition: service_healthy
    restart: unless-stopped


  # ── Application ───────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: deployments/docker/go.Dockerfile
      args:
        CMD: migrate
    command: ["-direction", "up", "-dir", "/app/migrations"]
    environment:
      <<: *service-env
      LOG_FORMAT: text
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: deployments/docker/go.Dockerfile
      args:
        CMD: api
    environment:
      <<: *service-env
      HTTP_ADDR: ":8090"
      METRICS_ADDR: ":9091"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      OTEL_SERVICE_NAME: user-management-api
      # Local development sits behind a single source IP (the docker gateway),
      # so the whole team — and the test suites — share one bucket. The service
      # default is 50 rps; tune this per environment in production, where
      # clients arrive from distinct addresses.
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-300}
      # Brute-force protection stays strict: 10 sign-ins per minute per IP.
      LOGIN_RATE_LIMIT_PER_MIN: ${LOGIN_RATE_LIMIT_PER_MIN:-10}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL must be set (see .env.example)}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD must be set (see .env.example)}
    ports:
      - "${API_PORT:-8090}:8090"
      - "${API_METRICS_PORT:-9091}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_started
      openfga:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deployments/docker/go.Dockerfile
      args:
        CMD: worker
    environment:
      <<: *service-env
      METRICS_ADDR: ":9092"
      OTEL_SERVICE_NAME: outbox-worker
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      # The worker never serves HTTP, but LoadConfig is shared.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-unused@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Unused@111118}
    ports:
      - "${WORKER_METRICS_PORT:-9092}:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin-portal:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8090}
    ports:
      - "${PORTAL_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ── Observability ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deployments/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"  # UI
      - "4318:4318"                        # OTLP HTTP

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  openfga-data:
  prometheus-data:
  grafana-data:
  opa-studio-data:
