global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: wallet-gateway

scrape_configs:
  - job_name: user-management-api
    static_configs:
      - targets: ["api:9091"]
        labels:
          service: user-management-api

  - job_name: outbox-worker
    static_configs:
      - targets: ["worker:9092"]
        labels:
          service: outbox-worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
