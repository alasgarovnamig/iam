server {
    listen 80;
    server_name _;

    # Serve the single-page viewer.
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Reverse-proxy every OPA call under /opa/ to the opa service. The browser
    # therefore talks to same-origin nginx and never hits CORS. The trailing
    # slash on both sides strips the /opa/ prefix:
    #   /opa/v1/policies  ->  http://opa:8181/v1/policies
    location /opa/ {
        proxy_pass http://opa:8181/;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
